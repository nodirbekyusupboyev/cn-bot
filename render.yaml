services:
  - type: web
    name: movietimecn-bot-24-7
    env: python
    plan: free
    buildCommand: pip install --only-binary=:all: -r requirements.txt || pip install -r requirements.txt
    startCommand: python main.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9

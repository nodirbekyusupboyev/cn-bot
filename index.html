<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MOVITIMECN • Cinema & Cartoon World</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #080c16;
            --bg-secondary: #111827;
            --bg-card: rgba(23, 33, 53, 0.9);
            --bg-glass: rgba(15, 23, 42, 0.88);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-1: #38bdf8;
            --accent-2: #6366f1;
            --accent-gradient: linear-gradient(135deg, #38bdf8 0%, #6366f1 100%);
            --banner-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0284c7 100%);
            --card-border: rgba(56, 189, 248, 0.25);
            --card-radius: 18px;
            --pill-radius: 14px;
            --shadow-glow: 0 10px 30px -5px rgba(56, 189, 248, 0.3);
            --font-main: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        /* =========================================================
           BOLAJONLAR UCHUN YORQIN MULTFILM REJIMI (KIDS CARTOON MODE)
           ========================================================= */
        body.kids-mode {
            --bg-main: #fffdf2;
            --bg-secondary: #e0f2fe;
            --bg-card: #ffffff;
            --bg-glass: rgba(255, 255, 255, 0.94);
            --text-primary: #1e293b;
            --text-secondary: #475569;
            --accent-1: #0284c7;
            --accent-2: #f59e0b;
            --accent-gradient: linear-gradient(135deg, #FF6B6B 0%, #FF8E53 50%, #f59e0b 100%);
            --banner-gradient: linear-gradient(135deg, #0ea5e9 0%, #8b5cf6 50%, #ec4899 100%);
            --card-border: rgba(14, 165, 233, 0.45);
            --card-radius: 26px;
            --pill-radius: 999px;
            --shadow-glow: 0 12px 28px -4px rgba(14, 165, 233, 0.3);
            --font-main: 'Fredoka', 'Outfit', sans-serif;
        }

                /* =========================================================
           LUCIDE ICONS STYLING (MODERN SVG SYSTEM)
           ========================================================= */
        .lucide, i[data-lucide] {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            vertical-align: -0.15em;
            width: 1.15em;
            height: 1.15em;
            stroke-width: 2px;
            stroke: currentColor;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
            flex-shrink: 0;
        }

        .nav-item .nav-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 21px;
            transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .nav-item .nav-icon svg,
        .nav-item .nav-icon i[data-lucide] {
            width: 22px;
            height: 22px;
            stroke-width: 2.2px;
        }

        .menu-trigger-btn {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .menu-trigger-btn svg,
        .menu-trigger-btn i[data-lucide] {
            width: 20px;
            height: 20px;
            stroke-width: 2.3px;
        }

        .drawer-close {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .drawer-close svg,
        .drawer-close i[data-lucide] {
            width: 18px;
            height: 18px;
            stroke-width: 2.2px;
        }

        .drawer-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .drawer-item svg,
        .drawer-item i[data-lucide] {
            width: 18px;
            height: 18px;
            stroke-width: 2px;
            color: var(--accent-1);
        }

        .search-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
        }
        .search-icon svg,
        .search-icon i[data-lucide] {
            width: 17px;
            height: 17px;
            stroke-width: 2.2px;
        }

        .code-quick-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }
        .code-quick-btn svg,
        .code-quick-btn i[data-lucide] {
            width: 15px;
            height: 15px;
            stroke-width: 2.2px;
        }

        .portal-icon {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .portal-icon svg,
        .portal-icon i[data-lucide] {
            width: 24px;
            height: 24px;
            stroke-width: 2.2px;
            color: #ffffff;
        }

        .genre-bento-emoji {
            display: flex;
            align-items: center;
            justify-content: center;
            filter: drop-shadow(0 3px 6px rgba(0,0,0,0.25));
            color: #ffffff;
            margin-bottom: 2px;
        }
        .genre-bento-emoji svg,
        .genre-bento-emoji i[data-lucide] {
            width: 28px;
            height: 28px;
            stroke-width: 2px;
        }

        .poster-art-emoji {
            display: flex;
            align-items: center;
            justify-content: center;
            filter: drop-shadow(0 6px 14px rgba(0,0,0,0.35));
            z-index: 2;
            color: #ffffff;
        }
        .poster-art-emoji svg,
        .poster-art-emoji i[data-lucide] {
            width: 58px;
            height: 58px;
            stroke-width: 1.8px;
        }

        .hero-big-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            filter: drop-shadow(0 8px 16px rgba(0,0,0,0.3));
            animation: pulseIcon 3s ease-in-out infinite;
            flex-shrink: 0;
            color: #ffffff;
        }
        .hero-big-icon svg,
        .hero-big-icon i[data-lucide] {
            width: 54px;
            height: 54px;
            stroke-width: 1.8px;
        }

        .fav-heart-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            color: #f8fafc;
        }
        .fav-heart-btn svg,
        .fav-heart-btn i[data-lucide] {
            width: 18px;
            height: 18px;
            stroke-width: 2px;
            transition: all 0.2s ease;
        }
        .fav-heart-btn.active svg,
        .fav-heart-btn.active i[data-lucide],
        .fav-heart-btn .heart-filled,
        .heart-filled {
            color: #ef4444 !important;
            fill: #ef4444 !important;
            stroke: #ef4444 !important;
        }

        .poster-rating-tag {
            display: inline-flex;
            align-items: center;
            gap: 3px;
        }
        .poster-rating-tag svg,
        .poster-rating-tag i[data-lucide] {
            width: 11px;
            height: 11px;
            fill: #fbbf24;
            stroke: none;
        }

        .detail-tag {
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        .detail-tag svg,
        .detail-tag i[data-lucide] {
            width: 13px;
            height: 13px;
            stroke-width: 2px;
        }
        .detail-tag svg.star-icon,
        .detail-tag i[data-lucide="star"] {
            fill: #fbbf24;
            stroke: none;
        }

        .detail-code-pill {
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        .detail-code-pill svg,
        .detail-code-pill i[data-lucide] {
            width: 13px;
            height: 13px;
            stroke-width: 2px;
        }

        .detail-banner > span:first-child {
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
        }
        .detail-banner > span:first-child svg,
        .detail-banner > span:first-child i[data-lucide] {
            width: 68px;
            height: 68px;
            stroke-width: 1.8px;
            filter: drop-shadow(0 6px 16px rgba(0,0,0,0.45));
        }

        .watch-card-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }
        .watch-card-btn svg,
        .watch-card-btn i[data-lucide] {
            width: 12px;
            height: 12px;
            fill: currentColor;
            stroke-width: 0;
        }

        .cat-chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .cat-chip svg,
        .cat-chip i[data-lucide] {
            width: 15px;
            height: 15px;
            stroke-width: 2px;
        }

        .profile-avatar-circle {
            display: flex;
            align-items: center;
            justify-content: center;
            color: #f8fafc;
        }
        .profile-avatar-circle svg,
        .profile-avatar-circle i[data-lucide] {
            width: 24px;
            height: 24px;
            stroke-width: 2px;
        }

        .profile-status-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .profile-status-badge svg,
        .profile-status-badge i[data-lucide] {
            width: 13px;
            height: 13px;
            stroke-width: 2px;
        }

        .early-stage-pill {
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        .early-stage-pill svg,
        .early-stage-pill i[data-lucide] {
            width: 12px;
            height: 12px;
            stroke-width: 2px;
        }

        .wallet-topup-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .wallet-topup-btn svg,
        .wallet-topup-btn i[data-lucide] {
            width: 14px;
            height: 14px;
            stroke-width: 2.2px;
        }

        .kpi-box .kpi-label {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .kpi-box .kpi-label svg,
        .kpi-box .kpi-label i[data-lucide] {
            width: 14px;
            height: 14px;
            stroke-width: 2px;
            color: var(--accent-1);
        }

        .section-heading h3 {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .section-heading h3 svg,
        .section-heading h3 i[data-lucide] {
            width: 18px;
            height: 18px;
            stroke-width: 2px;
            color: var(--accent-1);
        }

        .strip-title {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .strip-title svg,
        .strip-title i[data-lucide] {
            width: 15px;
            height: 15px;
            stroke-width: 2px;
            color: var(--accent-1);
        }

        .live-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #10b981;
            display: inline-block;
            box-shadow: 0 0 8px #10b981;
            animation: pulseDot 1.6s infinite ease-in-out;
            margin-right: 4px;
        }
        @keyframes pulseDot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.85); }
        }

        .toast {
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .toast svg,
        .toast i[data-lucide] {
            width: 18px;
            height: 18px;
            stroke-width: 2.2px;
            color: #10b981;
        }

        .floating-emoji {
            position: absolute;
            opacity: 0.16;
            animation: floatSlow 7s ease-in-out infinite;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent-1);
        }
        .floating-emoji svg,
        .floating-emoji i[data-lucide] {
            width: 28px;
            height: 28px;
            stroke-width: 1.8px;
        }
        body.kids-mode .floating-emoji {
            opacity: 0.32;
            color: var(--accent-2);
        }
        body.kids-mode .floating-emoji svg,
        body.kids-mode .floating-emoji i[data-lucide] {
            width: 32px;
            height: 32px;
        }


        /* Category-Specific Card Styles */
        body[data-cat="scifi"] .movie-card {
            border: 1.5px solid rgba(6, 182, 212, 0.5);
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.22), inset 0 0 12px rgba(6, 182, 212, 0.12);
        }
        body[data-cat="action"] .movie-card {
            border-radius: 12px;
            border: 1.5px solid rgba(239, 68, 68, 0.5);
            box-shadow: 0 8px 24px rgba(239, 68, 68, 0.22);
        }
        body[data-cat="retro_movie"] .movie-card,
        body[data-cat="retro_cartoon"] .movie-card {
            border: 2.5px dashed rgba(245, 158, 11, 0.65);
        }
        body[data-cat="national"] .movie-card {
            border: 2px solid rgba(20, 184, 166, 0.55);
            box-shadow: 0 8px 24px rgba(14, 165, 233, 0.22);
        }
        body[data-cat="anime"] .movie-card {
            border: 2px solid rgba(236, 72, 153, 0.5);
            border-radius: 22px;
        }
        body[data-cat="family"] .movie-card {
            border: 2px solid rgba(16, 185, 129, 0.45);
            border-radius: 22px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-primary);
            font-family: var(--font-main);
            padding-bottom: 92px;
            min-height: 100vh;
            overflow-x: hidden;
            transition: background-color 0.35s ease, color 0.3s ease;
            position: relative;
        }

        .ambient-bg {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }
        .ambient-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(75px);
            opacity: 0.35;
            transition: all 0.5s ease;
        }
        .orb-1 {
            width: 280px;
            height: 280px;
            top: -80px;
            left: -60px;
            background: var(--accent-1);
        }
        .orb-2 {
            width: 260px;
            height: 260px;
            top: 240px;
            right: -80px;
            background: var(--accent-2);
        }
        body.kids-mode .ambient-orb {
            opacity: 0.26;
        }

        .theme-decorations {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }
        .floating-emoji {
            position: absolute;
            font-size: 23px;
            opacity: 0.16;
            animation: floatSlow 7s ease-in-out infinite;
        }
        body.kids-mode .floating-emoji {
            opacity: 0.35;
            font-size: 28px;
        }
        @keyframes floatSlow {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-16px) rotate(8deg); }
        }

        /* =========================================================
           TOP STICKY HEADER
           ========================================================= */
        .top-header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: var(--bg-glass);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1.5px solid var(--card-border);
            padding: 11px 14px;
            transition: all 0.3s ease;
        }

        .header-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .left-header-group {
            display: flex;
            align-items: center;
            gap: 9px;
        }

        .menu-trigger-btn {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            border: 1.5px solid var(--card-border);
            background: var(--accent-gradient);
            color: #fff;
            font-size: 19px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: var(--shadow-glow);
            flex-shrink: 0;
        }

        .brand-box {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .brand-title {
            font-size: 17px;
            font-weight: 800;
            letter-spacing: 0.3px;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1.1;
        }

        body.kids-mode .brand-title {
            background: linear-gradient(135deg, #0284c7, #ec4899, #f59e0b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .brand-sub {
            font-size: 10.5px;
            color: var(--text-secondary);
            font-weight: 600;
        }

        .lang-switcher {
            display: flex;
            background: rgba(148, 163, 184, 0.15);
            padding: 3px;
            border-radius: 11px;
            border: 1px solid var(--card-border);
            gap: 2px;
        }

        .lang-btn {
            border: none;
            background: transparent;
            color: var(--text-secondary);
            font-family: var(--font-main);
            font-size: 10.5px;
            font-weight: 800;
            padding: 5px 7px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .lang-btn.active {
            background: var(--accent-gradient);
            color: #ffffff;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
        }

        .search-wrap {
            margin-top: 9px;
            display: flex;
            gap: 8px;
        }

        .search-box {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
        }

        .search-box input {
            width: 100%;
            background: rgba(148, 163, 184, 0.12);
            border: 1.5px solid var(--card-border);
            color: var(--text-primary);
            padding: 9px 14px 9px 36px;
            border-radius: var(--pill-radius);
            font-family: var(--font-main);
            font-size: 13px;
            outline: none;
            transition: all 0.25s ease;
        }

        .search-box input::placeholder {
            color: var(--text-secondary);
        }

        .search-box input:focus {
            border-color: var(--accent-1);
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.18);
        }

        .search-icon {
            position: absolute;
            left: 12px;
            font-size: 14px;
            pointer-events: none;
        }

        .code-quick-btn {
            border: none;
            background: var(--accent-gradient);
            color: #fff;
            font-family: var(--font-main);
            font-weight: 700;
            font-size: 12px;
            padding: 0 13px;
            border-radius: var(--pill-radius);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            white-space: nowrap;
            box-shadow: var(--shadow-glow);
        }

        /* =========================================================
           SLIDE-OUT FULL INTERACTIVE MENU DRAWER
           ========================================================= */
        .drawer-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.72);
            backdrop-filter: blur(6px);
            z-index: 2500;
            display: none;
        }
        .drawer-overlay.open {
            display: block;
            animation: fadeIn 0.2s ease;
        }
        .menu-drawer {
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            width: 86%;
            max-width: 340px;
            background: var(--bg-secondary);
            color: var(--text-primary);
            z-index: 2600;
            padding: 18px 16px 30px;
            overflow-y: auto;
            transform: translateX(-100%);
            transition: transform 0.28s cubic-bezier(0.16, 1, 0.3, 1);
            border-right: 2px solid var(--card-border);
        }
        body.kids-mode .menu-drawer {
            background: #fffdf5;
        }
        .drawer-overlay.open .menu-drawer {
            transform: translateX(0);
        }
        .drawer-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 14px;
            margin-bottom: 14px;
            border-bottom: 1px solid var(--card-border);
        }
        .drawer-close {
            width: 34px;
            height: 34px;
            border-radius: 10px;
            border: 1px solid var(--card-border);
            background: rgba(148, 163, 184, 0.15);
            color: var(--text-primary);
            font-size: 16px;
            cursor: pointer;
        }
        .drawer-section-label {
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--accent-1);
            margin: 14px 0 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .drawer-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 7px;
        }
        .drawer-item {
            border: 1px solid var(--card-border);
            background: var(--bg-card);
            color: var(--text-primary);
            padding: 10px 10px;
            border-radius: 13px;
            font-family: var(--font-main);
            font-size: 12px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 7px;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s ease;
        }
        .drawer-item.active-item {
            background: var(--accent-gradient);
            color: #fff;
            border-color: transparent;
        }

        /* =========================================================
           MAIN CONTENT & DYNAMIC HERO BANNER
           ========================================================= */
        .app-content {
            position: relative;
            z-index: 1;
            padding: 14px 15px;
        }

        .category-hero {
            position: relative;
            border-radius: var(--card-radius);
            background: var(--banner-gradient);
            padding: 20px 18px;
            margin-bottom: 18px;
            color: #ffffff;
            overflow: hidden;
            box-shadow: var(--shadow-glow);
            border: 1.5px solid rgba(255, 255, 255, 0.2);
            transition: all 0.4s ease;
        }

        .category-hero::after {
            content: '';
            position: absolute;
            right: -30px;
            bottom: -30px;
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.12);
            pointer-events: none;
        }

        .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.22);
            backdrop-filter: blur(6px);

            justify-content: space-between;
            margin-bottom: 9px;

        .cat-chip {
            border: 1.5px solid var(--card-border);
            background: var(--bg-card);
            color: var(--text-primary);

            border-radius: var(--pill-radius);

            font-weight: 700;

            box-shadow: var(--shadow-glow);

        }
        .portal-card:active {
            transform: scale(0.96);
        }
        .portal-movies {
            background: linear-gradient(135deg, #1e1b4b 0%, #4338ca 50%, #0284c7 100%);
        }
        .portal-cartoons {
            background: linear-gradient(135deg, #f43f5e 0%, #fb923c 50%, #eab308 100%);
        }
        .portal-icon {
            font-size: 34px;
            margin-bottom: 7px;
            display: block;
        }
        .portal-title {
            font-size: 16px;
            font-weight: 800;
            margin-bottom: 3px;
        }
        .portal-sub {
            font-size: 11px;
            opacity: 0.92;
            font-weight: 600;
        }

        .genre-bento-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 9px;
            margin-bottom: 20px;

        .genre-bento-card {

            padding: 11px 7px;
            text-align: center;
            color: #fff;

            align-items: center;
            justify-content: center;
            gap: 5px;

            transform: scale(0.94);
        }
        .genre-bento-card.selected-bento {
            border: 2.5px solid #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.38);
        }
        .genre-bento-emoji {
            font-size: 25px;
            filter: drop-shadow(0 3px 6px rgba(0,0,0,0.25));
        }
        .genre-bento-name {
            font-size: 11.5px;
            font-weight: 700;
            line-height: 1.15;
            text-shadow: 0 1px 4px rgba(0,0,0,0.4);
        }
        body.kids-mode .genre-bento-card {
            border-radius: 22px;
            min-height: 92px;
            border-width: 2.5px;

        /* =========================================================
           MOVIES & CARTOONS CARDS GRID
           ========================================================= */

            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 13px;
        }
        .section-heading h3 {
            font-size: 16.5px;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 7px;
        }
        .count-pill {
            font-size: 11px;
            font-weight: 700;
            padding: 3px 10px;
            border-radius: 999px;
            background: rgba(148, 163, 184, 0.16);
            color: var(--text-secondary);
        }

        .movies-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 13px;
        }
        .movie-card {
            background: var(--bg-card);
            border: 1.5px solid var(--card-border);
            border-radius: var(--card-radius);
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.18);
            transition: all 0.25s ease;

            flex-direction: column;

        }

            box-shadow: 0 10px 24px rgba(2, 132, 199, 0.16);
        }
        .movie-card:active {
            transform: scale(0.96);
        }

        .movie-poster {
            width: 100%;
            height: 168px;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            padding: 12px;
            text-align: center;
        }
        .poster-art-emoji {
            font-size: 52px;
            filter: drop-shadow(0 6px 14px rgba(0,0,0,0.35));
            z-index: 2;
        }
        .poster-code-tag {
            position: absolute;
            top: 8px;
            left: 8px;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(6px);
            color: #fff;
            font-size: 11px;
            font-weight: 800;
            padding: 3px 8px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.25);
            z-index: 3;
        }
        .poster-rating-tag {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(245, 158, 11, 0.94);
            color: #fff;
            font-size: 11px;
            font-weight: 800;
            padding: 3px 7px;
            border-radius: 8px;
            z-index: 3;
        }
        .poster-quality-tag {
            position: absolute;
            bottom: 8px;
            right: 8px;
            background: rgba(0, 0, 0, 0.58);
            backdrop-filter: blur(6px);
            color: #fff;
            font-size: 10px;
            font-weight: 800;
            padding: 2px 7px;
            border-radius: 6px;
            z-index: 3;
        }
        .fav-heart-btn {
            position: absolute;
            bottom: 8px;
            left: 8px;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.5);
            border: none;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            cursor: pointer;
            z-index: 4;
        }

        .movie-info {
            padding: 11px 11px 12px;
            display: flex;
            flex-direction: column;
            flex: 1;
            justify-content: space-between;
        }
        .movie-title {
            font-size: 13.5px;
            font-weight: 700;
            line-height: 1.25;
            margin-bottom: 5px;
            display: -webkit-box;
            -webkit-line-clamp: 1;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .movie-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 11px;
            color: var(--text-secondary);
            margin-bottom: 9px;
            font-weight: 600;
        }
        .watch-card-btn {
            width: 100%;
            border: none;
            background: var(--accent-gradient);
            color: #fff;
            font-family: var(--font-main);
            font-size: 12px;
            font-weight: 700;
            padding: 8px 10px;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }
        body.kids-mode .watch-card-btn {
            border-radius: 999px;
        }

        /* =========================================================
           MODALS & BUILT-IN VIDEO PLAYER
           ========================================================= */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.78);
            backdrop-filter: blur(8px);
            z-index: 2000;
            display: none;
            align-items: flex-end;
            justify-content: center;
        }
        .modal-overlay.open {
            display: flex;
            animation: fadeIn 0.2s ease;
        }
        .modal-sheet {
            width: 100%;
            max-width: 500px;
            background: var(--bg-secondary);
            color: var(--text-primary);
            border-top-left-radius: 28px;
            border-top-right-radius: 28px;
            padding: 18px 18px 28px;
            border-top: 2px solid var(--card-border);
            box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.5);
            animation: slideUp 0.28s cubic-bezier(0.16, 1, 0.3, 1);
            max-height: 92vh;
            overflow-y: auto;
        }
        body.kids-mode .modal-sheet {
            background: #ffffff;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }
        .modal-handle {
            width: 44px;
            height: 5px;
            background: rgba(148, 163, 184, 0.4);
            border-radius: 999px;
            margin: 0 auto 14px;
        }
        .detail-banner {
            height: 185px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 70px;
            position: relative;
            margin-bottom: 14px;
            box-shadow: var(--shadow-glow);
            overflow: hidden;
        }
        .detail-code-pill {
            position: absolute;
            bottom: 12px;
            left: 12px;
            background: rgba(0, 0, 0, 0.78);
            color: #fff;
            padding: 5px 12px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 800;
            z-index: 4;
        }
        .quality-selector-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 14px;
        }
        .q-pill {
            flex: 1;
            padding: 8px;
            border-radius: 10px;
            border: 1.5px solid var(--card-border);
            background: rgba(148, 163, 184, 0.12);
            color: var(--text-primary);
            font-family: var(--font-main);
            font-size: 12px;
            font-weight: 800;
            cursor: pointer;
            text-align: center;
        }
        .q-pill.active-q {
            background: var(--accent-gradient);
            color: #fff;
            border-color: transparent;
        }
        .detail-title {
            font-size: 20px;
            font-weight: 800;
            margin-bottom: 6px;
        }
        .detail-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 7px;
            margin-bottom: 12px;
        }
        .detail-tag {
            font-size: 11.5px;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 8px;
            background: rgba(148, 163, 184, 0.16);
            color: var(--text-primary);
        }
        .detail-desc {
            font-size: 13.5px;
            line-height: 1.5;
            color: var(--text-secondary);
            margin-bottom: 16px;
        }
        .detail-actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .btn-primary-watch {
            width: 100%;
            border: none;
            background: var(--accent-gradient);
            color: #fff;
            font-family: var(--font-main);
            font-size: 15px;
            font-weight: 800;
            padding: 14px;
            border-radius: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: var(--shadow-glow);
        }
        .btn-secondary-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .btn-outline {
            border: 1.5px solid var(--card-border);
            background: rgba(148, 163, 184, 0.1);
            color: var(--text-primary);
            font-family: var(--font-main);
            font-size: 13px;
            font-weight: 700;
            padding: 11px;
            border-radius: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .code-input-big {
            width: 100%;
            text-align: center;
            font-size: 26px;
            font-weight: 800;
            letter-spacing: 3px;
            padding: 14px;
            border-radius: 16px;
            border: 2px solid var(--accent-1);
            background: rgba(148, 163, 184, 0.1);
            color: var(--text-primary);
            font-family: var(--font-main);
            margin: 14px 0;
            outline: none;
        }

        /* =========================================================
           BOTTOM NAVIGATION BAR
           ========================================================= */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 72px;
            background: var(--bg-glass);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 1.5px solid var(--card-border);
            z-index: 1000;
            padding: 0 4px;
        }
        .nav-item {
            flex: 1;
            border: none;
            background: transparent;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            font-family: var(--font-main);
            font-size: 10.5px;
            font-weight: 700;
            cursor: pointer;
            padding: 6px 0;
            border-radius: 14px;
            transition: all 0.25s ease;
            gap: 3px;
        }
        .nav-item .nav-icon {
            font-size: 21px;
            transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .nav-item.active {
            color: var(--accent-1);
        }
        body.kids-mode .nav-item.active {
            color: #ec4899;
        }
        .nav-item.active .nav-icon {
            transform: translateY(-3px) scale(1.18);
        }

        .toast {
            position: fixed;
            top: 76px;
            left: 50%;
            transform: translateX(-50%) translateY(-20px);
            background: #10b981;
            color: #fff;
            padding: 10px 18px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 700;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            z-index: 3000;
            opacity: 0;
            pointer-events: none;
            transition: all 0.25s ease;
            white-space: nowrap;
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .empty-state {
            text-align: center;
            padding: 34px 18px;
            background: var(--bg-card);
            border-radius: var(--card-radius);
            border: 1.5px dashed var(--card-border);
            margin-top: 10px;
        }

           ========================================================= */

            color: var(--accent-1);

            fetchEpgForChannel(ch);

            if (Hls.isSupported()) {
                if (hlsInstance) {
                    hlsInstance.destroy();
                }
                hlsInstance = new Hls({
                    enableWorker: true,
                    lowLatencyMode: true
                });
                hlsInstance.loadSource(ch.stream_url);
                hlsInstance.attachMedia(video);
                hlsInstance.on(Hls.Events.MANIFEST_PARSED, function () {
                    video.play().catch(e => console.log('Autoplay:', e));
                });
                hlsInstance.on(Hls.Events.ERROR, function(event, data) {
                    if (data.fatal) {
                        switch(data.type) {
                            case Hls.ErrorTypes.NETWORK_ERROR:
                                hlsInstance.startLoad();
                                break;
                            case Hls.ErrorTypes.MEDIA_ERROR:
                                hlsInstance.recoverMediaError();
                                break;
                            default:
                                hlsInstance.destroy();
                                break;
                        }
                    }
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = ch.stream_url;
                video.addEventListener('loadedmetadata', function () {
                    video.play().catch(e => console.log('Autoplay:', e));

                'Music': 'Musiqa',
                'Entertainment': 'Ko\'ngilochar',
                'News': 'Yangiliklar'
            };

            const filteredChannels = selectedTvCategory === 'all'
                ? currentTvChannels
                : currentTvChannels.filter(c => c.category && c.category.toLowerCase().includes(selectedTvCategory.toLowerCase()));

            let html = `
                <!-- 1. LIVE VIDEO PLAYER -->
                <div class="tv-player-card">
                    <div class="tv-video-wrapper">
                        <video id="tvLivePlayer" class="tv-video-element" controls playsinline autoplay></video>
                        <div class="tv-player-overlay">
                            <span class="tv-live-pill"><span class="tv-live-dot"></span> LIVE EFIR</span>
                            <span style="background:rgba(0,0,0,0.6);color:#38bdf8;font-size:10.5px;padding:3px 8px;border-radius:6px;font-weight:700;">HLS HD</span>
                        </div>
                    </div>
                    <div class="tv-current-info">
                        <div class="tv-current-channel">
                            <img id="tvCurrentLogo" class="tv-current-logo" src="${curCh.logo || ''}" alt="Logo" onerror="this.src='https://via.placeholder.com/100?text=TV'">
                            <div>
                                <h4 id="tvCurrentName" class="tv-current-name">${curCh.name || 'Telekanal'}</h4>
                                <p id="tvCurrentCat" class="tv-current-cat">${curCh.category || 'Jonli'} • JONLI EFIR</p>
                            </div>
                        </div>
                        <button onclick="playTvStream('${curCh.id || ''}')" style="background:linear-gradient(135deg,#38bdf8,#6366f1);border:none;color:#fff;padding:8px 14px;border-radius:10px;font-weight:700;font-size:12px;cursor:pointer;display:inline-flex;align-items:center;gap:5px;">
                            <i data-lucide="play" style="width:14px;height:14px;"></i> Qayta yoqish
                        </button>
                    </div>
                </div>

                <!-- 2. NOW PLAYING EPG MINI CARD -->
                <div class="epg-now-card">
                    <div class="epg-now-header">
                        <span class="epg-now-title"><i data-lucide="radio" style="width:15px;height:15px;color:#38bdf8;"></i> Hozir Efirda:</span>
                        <span id="epgNowTitle" style="font-size:12.5px;color:#38bdf8;font-weight:700;">Yuklanmoqda...</span>
                    </div>
                    <div class="epg-progress-bar-bg">
                        <div id="epgNowFill" class="epg-progress-bar-fill" style="width: 45%;"></div>
                    </div>
                    <div id="epgNextText" class="epg-next-text">
                        <i data-lucide="clock" style="width:13px;height:13px;"></i> Keyingi namoyish kutilmoqda...
                    </div>
                </div>

                <!-- 3. SUB-TAB SWITCHER: LIVE CHANNELS vs TELEDASTUR (00:00 - 23:59) -->
                <div class="epg-segmented-control">
                    <button class="epg-segment-btn ${tvSubTab === 'live' ? 'active' : ''}" onclick="switchTvSubTab('live')">
                        <i data-lucide="tv" style="width:15px;height:15px;"></i> Jonli Kanallar (${currentTvChannels.length})
                    </button>
                    <button class="epg-segment-btn ${tvSubTab === 'epg' ? 'active' : ''}" onclick="switchTvSubTab('epg')">
                        <i data-lucide="calendar" style="width:15px;height:15px;"></i> Kunlik Dastur (00:00 - 23:59)
                    </button>
                </div>
            `;

            if (tvSubTab === 'live') {
                // VIEW 1: LIVE CHANNELS GRID
                html += `
                    <div class="category-pills" style="margin-bottom:14px;">
                        ${cats.map(c => `
                            <button class="cat-pill ${selectedTvCategory === c ? 'active' : ''}" onclick="switchTvCategory('${c}')">
                                ${catNames[c] || c}
                            </button>
                        `).join('')}
                    </div>

                    <div class="tv-channels-grid">
                        ${filteredChannels.map(ch => {
                            const isPlaying = curCh.id === ch.id;
                            return `
                                <div class="tv-card ${isPlaying ? 'active-playing' : ''}" data-id="${ch.id}" onclick="playTvStream('${ch.id}')">
                                    ${isPlaying ? '<span class="tv-playing-indicator"><i data-lucide="volume-2" style="width:14px;height:14px;"></i></span>' : ''}
                                    <img class="tv-card-logo" src="${ch.logo}" alt="${ch.name}" onerror="this.src='https://via.placeholder.com/100?text=TV'">
                                    <h5 class="tv-card-name">${ch.name}</h5>
                                    <div style="display:flex;align-items:center;justify-content:center;gap:6px;width:100%;margin-top:4px;">
                                        <span class="tv-card-cat">${ch.category || 'Jonli'}</span>
                                        <button onclick="event.stopPropagation(); selectedEpgChannel = currentTvChannels.find(c => c.id === '${ch.id}'); switchTvSubTab('epg');" style="background:rgba(56,189,248,0.15);border:none;color:#38bdf8;padding:2px 6px;border-radius:6px;font-size:10px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:2px;">
                                            <i data-lucide="calendar" style="width:10px;height:10px;"></i> Dastur
                                        </button>
                                    </div>
                                </div>
                            `;
                        }).join('')}
                    </div>
                `;
            } else {
                // VIEW 2: FULL 24-HOUR TELEDASTUR (EPG 00:00 - 23:59)
                html += `
                    <div class="section-heading" style="margin-bottom:8px;">
                        <h3><i data-lucide="calendar"></i> ${epgCh.name} — Bugungi Dastur</h3>
                        <span class="count-pill">00:00 – 23:59</span>
                    </div>

                    <!-- Horizontal Channel Selector for EPG -->
                    <div class="epg-channels-slider">
                        ${currentTvChannels.map(ch => `
                            <button class="epg-ch-pill ${epgCh.id === ch.id ? 'active' : ''}" onclick="selectEpgChannel('${ch.id}')">
                                <img src="${ch.logo}" alt="${ch.name}" onerror="this.src='https://via.placeholder.com/100?text=TV'">
                                ${ch.name}
                            </button>
                        `).join('')}
                    </div>

                    <!-- Search within EPG schedule -->
                    <div class="search-input-wrapper" style="margin-bottom:12px;">
                        <i data-lucide="search" class="search-icon"></i>
                        <input type="text" class="search-input" placeholder="Ko'rsatuv, film yoki vaqtni izlang (masalan: 19:00, serial)..." oninput="handleEpgSearch(this.value)">
                    </div>

                    <!-- Timeline List Container -->
                    <div class="epg-timeline-list" id="epgTimelineContainer"></div>
                `;
            }

            container.innerHTML = html;
            refreshIcons();

            if (tvSubTab === 'epg') {
                renderEpgList();
            }

            setTimeout(() => {
                if (curCh.stream_url && !hlsInstance) {
                    playTvStream(curCh.id);
                } else {
                    updateNowPlayingBar();
                }
            }, 100);
        }

    </script>
</body>
</html>
